[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-stablelinks-plugin"
version = "0.1.2"
description = "Stable internal linking and durable external URLs for MkDocs via a page ID system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mkdocs", "mkdocs-plugin", "stablelinks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
]
dependencies = [
    "mkdocs>=1.5",
]

[project.urls]
Homepage = "https://github.com/dsferg/mkdocs-stablelinks-plugin"
Repository = "https://github.com/dsferg/mkdocs-stablelinks-plugin"
Issues = "https://github.com/dsferg/mkdocs-stablelinks-plugin/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.5",
]

[project.entry-points."mkdocs.plugins"]
stablelinks = "mkdocs_stablelinks.plugin:StablelinksPlugin"

[tool.setuptools.packages.find]
include = ["mkdocs_stablelinks*"]

[tool.pytest.ini_options]
addopts = "--cov=mkdocs_stablelinks --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (real bugs: unused imports, undefined names)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modernise idioms for target-version)
    "B",   # bugbear (likely bugs and footguns)
    "I",   # isort (import order)
]
