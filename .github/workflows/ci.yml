name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

  # The matrix job above resolves mkdocs to whatever is newest, so it never
  # exercises the floor declared in pyproject.toml. This job pins the oldest
  # supported MkDocs on the oldest supported Python, so a new API creeping
  # into the plugin fails here instead of breaking users pinned to 1.6.
  test-minimum-mkdocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies with the minimum supported MkDocs
        run: |
          pip install -e ".[dev]"
          pip install "mkdocs==1.6.0"

      - name: Verify the pin took effect
        run: |
          python - <<'EOF'
          import mkdocs
          assert mkdocs.__version__ == "1.6.0", f"expected 1.6.0, got {mkdocs.__version__}"
          print("mkdocs", mkdocs.__version__)
          EOF

      - name: Run tests
        run: pytest tests/
